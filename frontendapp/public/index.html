<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTN Frro Bar | Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="brand-container">
                <img src="./assets/logo.jpg" alt="Logo UTN" class="nav-logo">
                <span class="brand-name">UTN FRRO Bar</span>
            </div>

            <div class="auth-buttons">
                <button class="btn-auth">Iniciar sesión</button>
                <button class="btn-auth">Registrarse</button>
            </div>

            <div class="cart-container">
                <span class="cart-icon">🛒</span>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Bar UTN Frro un sitio para los estudiantes</h1>
                <p>Pedi online, mira el menu, las distintas opciones y retira.</p>
                <div class="hero-buttons">
                    <button id="btn-order" class="btn-primary">Ver Menú Completo</button>
                    <button class="btn-secondary">Contacto</button>
                </div>
            </div>
        </section>
    </main>
    <script src="../src/main.js"></script>
</body>
</html>
